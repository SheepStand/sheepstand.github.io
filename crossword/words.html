<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Word List | Crossword English</title>
    <link rel="stylesheet" href="style.css">
    <script src="shared.js" defer></script>
    <script src="words.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow" data-i18n="eyebrow">A LITTLE WORD PRACTICE</p>
          <h1 data-i18n="title">Word list</h1>
          <p class="subtitle" data-i18n="subtitle">Review meanings and track the words you have learned.</p>
        </div>
        <div class="header-controls">
          <a class="button button-secondary page-link" href="index.html" data-i18n="crosswordLink">Crossword</a>
          <a class="button button-secondary page-link" href="settings.html" data-i18n="settingsLink">Settings</a>
        </div>
      </header>

      <section class="toolbar words-toolbar">
        <p id="word-summary" class="word-summary" aria-live="polite"></p>
        <label class="search-control">
          <span data-i18n="searchLabel">Search</span>
          <input id="word-search" type="search" autocomplete="off">
        </label>
        <label class="language-control" for="word-progress-filter">
          <span data-i18n="progressFilterLabel">Learning status</span>
          <select id="word-progress-filter" aria-label="Learning status">
            <option value="all" data-i18n="filterAll">All words</option>
            <option value="learning" data-i18n="filterLearning">Learning</option>
            <option value="learned" data-i18n="filterLearned">Learned</option>
            <option value="not-learned" data-i18n="filterNotLearned">Not learned</option>
          </select>
        </label>
      </section>

      <p id="words-status" class="game-status" role="status" aria-live="polite"></p>

      <section class="word-table-panel">
        <div class="word-table-scroll">
          <table class="word-table">
            <thead>
              <tr>
                <th scope="col" data-i18n="wordColumn">Word</th>
                <th scope="col" data-i18n="audioColumn">Audio</th>
                <th scope="col" data-i18n="phoneticColumn">Pronunciation</th>
                <th scope="col" data-i18n="levelColumn">Level</th>
                <th scope="col" data-i18n="partOfSpeechColumn">Part of speech</th>
                <th scope="col" data-i18n="englishColumn">English meaning</th>
                <th scope="col" data-i18n="chineseColumn">Chinese meaning</th>
                <th scope="col" data-i18n="progressColumn">Progress</th>
                <th scope="col" data-i18n="actionColumn">Action</th>
              </tr>
            </thead>
            <tbody id="word-rows"></tbody>
          </table>
        </div>
      </section>
      <footer data-i18n="footer">Progress is saved in this browser.</footer>
    </main>
  </body>
</html>
