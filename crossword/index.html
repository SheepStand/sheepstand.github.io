<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Crossword English</title>
    <link rel="stylesheet" href="style.css">
    <script src="shared.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow" data-i18n="eyebrow">A LITTLE WORD PRACTICE</p>
          <h1 data-i18n="title">Crossword English</h1>
          <p class="subtitle" data-i18n="subtitle">Use the meanings to fill in the words.</p>
        </div>
        <div class="header-controls">
          <a class="button button-secondary page-link" href="words.html" data-i18n="wordsPageLink">Word list</a>
          <a class="button button-secondary page-link" href="settings.html" data-i18n="settingsLink">Settings</a>
        </div>
      </header>

      <section class="toolbar" aria-label="Game controls">
        <div class="game-actions">
          <button id="check-button" class="button button-secondary" type="button" data-i18n="check">Check answers</button>
          <button id="show-answer-button" class="button button-secondary" type="button" data-i18n="showAnswers">Show answers</button>
          <button id="save-button" class="button button-secondary" type="button" data-i18n="saveGame">Save game</button>
          <button id="load-button" class="button button-secondary" type="button" data-i18n="loadGame">Load saved game</button>
          <button id="new-button" class="button button-primary" type="button" data-i18n="newPuzzle">New puzzle</button>
        </div>
      </section>

      <p id="game-status" class="game-status" role="status" aria-live="polite"></p>

      <section class="game-layout" aria-label="Crossword game">
        <div class="board-panel">
          <div class="board-heading">
            <h2 data-i18n="boardTitle">Puzzle</h2>
            <span id="progress" class="progress"></span>
          </div>
          <div class="board-scroll">
            <div id="crossword" class="crossword" role="grid" aria-label="Crossword puzzle"></div>
          </div>
        </div>
        <aside class="clue-panel">
          <div class="clue-column">
            <h2 data-i18n="across">Across</h2>
            <ol id="across-clues" class="clue-list"></ol>
          </div>
          <div class="clue-column">
            <h2 data-i18n="down">Down</h2>
            <ol id="down-clues" class="clue-list"></ol>
          </div>
        </aside>
      </section>
      <footer data-i18n="footer">Words are selected from the included vocabulary list.</footer>
    </main>
  </body>
</html>
